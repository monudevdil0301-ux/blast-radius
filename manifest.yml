modules:
  jira:globalPage:
    - key: blastradius-global-page
      title: 'BlastRadius Radar'
      resource: blastradius-frontend
      resolver:
        function: blastradius-resolver

  jira:projectPage:
    - key: blastradius-project-page
      title: 'BlastRadius Radar'
      resource: blastradius-frontend
      resolver:
        function: blastradius-resolver

  jira:issuePanel:
    - key: blastradius-panel
      title: 'BlastRadius: Impact & Dependency Radar'
      icon: https://raw.githubusercontent.com/atlassian/forge-ui/master/packages/components/icons/error.svg
      resource: blastradius-frontend
      resolver:
        function: blastradius-resolver
      viewportSize: large

  rovo:agent:
    - key: blastradius-agent
      name: 'BlastRadius Sentry'
      description: 'Autonomous architectural safety agent that calculates microservice
        blast radius, audits downstream incident risk, generates regression test
        suites in Jira, and drafts rollback playbooks in Confluence.'
      conversationStarters:
        - 'What is the blast radius of this ticket?'
        - 'Generate downstream regression tests for affected services'
        - 'Draft a Confluence rollback runbook for this deployment'
      prompt: >
        You are BlastRadius Sentry, an elite autonomous DevOps & Architectural
        Safety Agent integrated into Atlassian Jira, Bitbucket, Confluence, and
        Compass. Your mission is to prevent catastrophic production incidents by
        analyzing the blast radius of code changes and Jira issues before they
        deploy. When asked to analyze blast radius: 1. Examine the root
        microservice, its upstream callers, and downstream dependencies using
        the Teamwork Graph and Compass catalog. 2. Inspect recent incident
        histories (P1/P2 tickets) on downstream consumers. 3. Identify any stale
        Confluence architectural decision records (ADRs) or missing runbooks. 4.
        Suggest or execute concrete remediation actions: generating Jira
        regression test sub-tasks, alerting service owners, or drafting
        Confluence rollback procedures.
      actions:
        - analyze-blast-radius
        - generate-regression-tests
        - draft-rollback-runbook

  action:
    - key: analyze-blast-radius
      name: 'Analyze Blast Radius'
      description: 'Analyzes the full downstream microservice blast radius and
        calculates a risk score (0-100) based on incident history and cyclomatic
        dependencies.'
      function: rovo-action-handler
      actionVerb: GET
      inputs:
        issueKey:
          title: Issue Key
          type: string
          required: true
          description: 'The Jira issue key (e.g. PROJ-104).'

    - key: generate-regression-tests
      name: 'Generate Regression Tests'
      description: 'Creates linked regression test sub-tasks in Jira for all impacted
        downstream microservices.'
      function: rovo-action-handler
      actionVerb: CREATE
      inputs:
        issueKey:
          title: Issue Key
          type: string
          required: true
          description: 'The parent Jira issue key.'

    - key: draft-rollback-runbook
      name: 'Draft Rollback Runbook'
      description: 'Drafts a comprehensive incident rollback playbook in Confluence
        with verified health-check endpoints and owner escalation chains.'
      function: rovo-action-handler
      actionVerb: CREATE
      inputs:
        issueKey:
          title: Issue Key
          type: string
          required: true
          description: 'The Jira issue key.'

  function:
    - key: blastradius-resolver
      handler: index.handler
    - key: rovo-action-handler
      handler: rovo.actionHandler

resources:
  - key: blastradius-frontend
    path: static/frontend/dist

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:page:confluence
    - write:page:confluence
    - storage:app

app:
  id: ari:cloud:ecosystem::app/9f790c41-4dac-4d35-8296-fe3ab4c0d303
  runtime:
    name: nodejs22.x
